<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Unbounded';src:url(./fonts/unbounded-800.woff2) format('woff2');font-weight:800;}
@font-face{font-family:'Unbounded';src:url(./fonts/unbounded-600.woff2) format('woff2');font-weight:600;}
@font-face{font-family:'Space Grotesk';src:url(./fonts/space-grotesk-400.woff2) format('woff2');font-weight:400;}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#08080a;overflow:hidden;
  font-family:'Space Grotesk',sans-serif;color:#f2f0f1;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,36,80,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,36,80,.07) 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:900px;height:900px;left:-260px;top:-200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,36,80,.16) 0%,transparent 62%)}
.wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 84px;gap:48px}
h1{font-family:'Unbounded';font-weight:800;font-size:78px;line-height:1.0;text-transform:uppercase;letter-spacing:-2px}
.neon{color:#ff2450;text-shadow:0 0 22px rgba(255,36,80,.75),0 0 60px rgba(255,36,80,.4)}
.tag{display:inline-block;border:1px solid #ff2450;color:#ff2450;font-size:19px;letter-spacing:5px;
  text-transform:uppercase;padding:11px 22px;border-radius:100px;margin-bottom:34px;
  box-shadow:0 0 22px rgba(255,36,80,.28),inset 0 0 16px rgba(255,36,80,.14)}
.meta{margin-top:38px;color:#9a969a;font-size:25px;line-height:1.6}
.meta b{color:#f2f0f1;font-family:'Unbounded';font-weight:600}
.chair{filter:drop-shadow(0 0 12px rgba(255,36,80,.85)) drop-shadow(0 0 44px rgba(255,36,80,.45));flex-shrink:0}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div>
    <span class="tag">Barber Shop · Paris 20e</span>
    <h1>Ta coupe.<br>Ton style.<br><span class="neon">Zéro compromis.</span></h1>
    <div class="meta"><b>The Line Up</b> — 265 rue des Pyrénées<br>Mar – Dim · 10h30 – 20h</div>
  </div>
  <svg class="chair" width="340" height="408" viewBox="0 0 100 120" fill="none">
    <g stroke="#ff2450" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="42" y="4" width="16" height="12" rx="5"/>
      <rect x="29" y="20" width="42" height="30" rx="9"/>
      <rect x="15" y="54" width="18" height="7" rx="3.5"/>
      <rect x="67" y="54" width="18" height="7" rx="3.5"/>
      <rect x="27" y="53" width="46" height="13" rx="5"/>
      <line x1="50" y1="66" x2="50" y2="106"/>
      <rect x="44" y="71" width="12" height="10" rx="2.5"/>
      <rect x="36" y="90" width="28" height="6" rx="3"/>
      <path d="M22 112 Q50 100 78 112"/>
    </g>
  </svg>
</div>
</body></html>
